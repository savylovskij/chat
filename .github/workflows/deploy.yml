name: Deploy Server

on:
  push:
    branches: [main, master]
    paths:
      - apps/server/**
      - packages/shared/**
      - pnpm-lock.yaml

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger Render deploy
        run: curl -sf "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
